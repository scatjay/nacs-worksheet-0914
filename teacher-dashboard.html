<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教師後台 · 115A02</title>
<link rel="stylesheet" href="shared.css?v=3">
<style>
.td-wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.td-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.td-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.td-cols{grid-template-columns:1fr}}
.td-col h2{font-size:15px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.td-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:12.5px}
.td-item .nm{font-weight:700}
.td-item .stars{font-size:13px;margin:4px 0}
.td-item .overall{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:6px}
.td-item .overall.ok{background:var(--ok-soft);color:var(--ok)}
.td-item .overall.warn{background:var(--seal-soft);color:var(--seal)}
.td-item .crit{margin-top:6px;font-size:11.5px;color:var(--muted)}
.td-item .crit div{margin-top:2px}
.td-item .crit .no{color:var(--seal)}
.td-item .sugg{margin-top:6px;font-size:12px;background:var(--surface2);border-radius:7px;padding:7px 9px}
.td-item a{color:var(--accent);word-break:break-all}
.td-empty{color:var(--muted);font-size:13px;padding:10px 0}
.td-note{font-size:12px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="gt">🔒 教師後台（僅限楊老師）</div>
  <input type="password" id="gatePass" placeholder="教師密碼" inputmode="numeric">
  <button id="gateBtn">進入</button>
  <div class="st" id="gateStatus"></div>
</div>
<div class="td-wrap" id="pageContent" hidden>
  <div class="td-head">
    <h1 style="font-size:20px">📊 教師後台 — 即時作業掃描</h1>
    <a href="index.html" style="margin-left:auto;color:var(--muted);font-size:13px">← 回學員頁面</a>
  </div>
  <div class="td-cols">
    <div class="td-col"><h2>模組1 STAR提示語</h2><div id="colPractice"></div></div>
    <div class="td-col"><h2>模組2 NotebookLM</h2><div id="colShare2"></div></div>
    <div class="td-col"><h2>模組3 AI海報</h2><div id="colShare3"></div></div>
  </div>
  <div class="td-note">
    此頁只顯示掃描結果，不會自動觸發掃描。掃描由本機執行 <code>screen_submissions.py</code>（或背景watcher）完成後寫回Firebase，這頁即時反映最新結果。
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBwPR0oE5VK0eBlqq8JY1B56UXy3R9cyng",
  databaseURL: "https://gen-lang-client-0929530380-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gen-lang-client-0929530380",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT = "nacs0914";
const TEACHER_CODE = "0914"; // 老師專用密碼(正日期)，跟學員的4190(反過來)不同，不要告訴學員

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starsHtml(n){ n = Math.max(0, Math.min(5, Number(n)||0)); return '⭐'.repeat(n) + '☆'.repeat(5-n); }

function renderColumn(collection, elId) {
  db.ref(`${ROOT}/${collection}`).on('value', rawSnap => {
    db.ref(`${ROOT}/screening/${collection}`).on('value', scrSnap => {
      const raw = rawSnap.val() || {};
      const scr = scrSnap.val() || {};
      const el = document.getElementById(elId);
      const ids = Object.keys(raw).sort((a,b) => (raw[a].updatedAt||0) - (raw[b].updatedAt||0));
      if (!ids.length) { el.innerHTML = '<div class="td-empty">目前還沒有人繳交</div>'; return; }
      el.innerHTML = ids.map((id, i) => {
        const d = raw[id], s = scr[id];
        const overallClass = s ? (s.overall === '完成' ? 'ok' : 'warn') : '';
        return `<div class="td-item">
          <span class="nm">#${i+1} ${escapeHtml(d.nickname||'匿名')}</span>
          ${s ? `<span class="overall ${overallClass}">${escapeHtml(s.overall||'')}</span>` : '<span class="overall warn">尚未掃描</span>'}
          ${s ? `<div class="stars">${starsHtml(s.stars)}</div>` : ''}
          <div style="margin-top:4px"><a href="${escapeHtml(d.content||'')}" target="_blank">${escapeHtml(d.content||'')}</a></div>
          ${s && s.criteria ? `<div class="crit">${s.criteria.map(c => `<div class="${c.pass?'':'no'}">${c.pass?'✓':'✗'} ${escapeHtml(c.name)}：${escapeHtml(c.note||'')}</div>`).join('')}</div>` : ''}
          ${s && s.suggestion ? `<div class="sugg">💡 ${escapeHtml(s.suggestion)}</div>` : ''}
        </div>`;
      }).join('');
    });
  });
}

function initGate() {
  const gate = document.getElementById('gate'), content = document.getElementById('pageContent');
  if (localStorage.getItem('nacs0914_teacher_ok') === '1') { gate.hidden = true; content.hidden = false; return; }
  gate.hidden = false; content.hidden = true;
  const input = document.getElementById('gatePass'), btn = document.getElementById('gateBtn'), status = document.getElementById('gateStatus');
  const tryEnter = () => {
    if ((input.value||'').trim() !== TEACHER_CODE) { status.textContent = '密碼不對'; return; }
    try { localStorage.setItem('nacs0914_teacher_ok', '1'); } catch(e) {}
    gate.hidden = true; content.hidden = false;
  };
  btn.addEventListener('click', tryEnter);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
}

document.addEventListener('DOMContentLoaded', () => {
  initGate();
  renderColumn('practice_log', 'colPractice');
  renderColumn('share2', 'colShare2');
  renderColumn('share3', 'colShare3');
});
</script>
</body>
</html>
