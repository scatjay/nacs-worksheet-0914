<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教師後台 · 115A02</title>
<link rel="stylesheet" href="shared.css?v=10">
<style>
.td-wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}
.td-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px}
.td-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.td-tab{padding:9px 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.td-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.td-tab .cnt{font-family:var(--mono);font-size:11px;opacity:.8;margin-left:4px}
.td-panel[hidden]{display:none}
.td-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:12.5px;overflow:hidden}
.td-item summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.td-item summary::-webkit-details-marker{display:none}
.td-item summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .15s}
.td-item[open] summary::before{transform:rotate(90deg)}
.td-item .nm{font-weight:700}
.td-item .stars{font-size:12px;font-family:var(--mono)}
.td-item .overall{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700}
.td-item .overall.ok{background:var(--ok-soft);color:var(--ok)}
.td-item .overall.warn{background:var(--seal-soft);color:var(--seal)}
.badge-review{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.badge-bad{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700;background:var(--seal-soft);color:var(--seal)}
.td-body{padding:0 14px 12px;border-top:1px solid var(--line)}
.td-body .crit{margin-top:8px;font-size:11.5px;color:var(--muted)}
.td-body .crit div{margin-top:3px}
.td-body .crit .no{color:var(--seal)}
.td-body .sugg{margin-top:8px;font-size:12px;background:var(--surface2);border-radius:7px;padding:7px 9px}
.td-body a{color:var(--accent);word-break:break-all;font-size:11.5px;display:block;margin-top:8px}
.td-empty{color:var(--muted);font-size:13px;padding:10px 0}
.td-note{font-size:12px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div id="gate" hidden>
  <div class="gt">🔒 教師後台（僅限楊老師）</div>
  <input type="password" id="gatePass" placeholder="教師密碼" inputmode="numeric">
  <button id="gateBtn">進入</button>
  <div class="st" id="gateStatus"></div>
</div>
<div class="td-wrap" id="pageContent" hidden>
  <div class="td-head">
    <h1 style="font-size:20px">📊 教師後台 — 即時作業掃描</h1>
    <a href="index.html" style="margin-left:auto;color:var(--muted);font-size:13px">← 回學員頁面</a>
  </div>
  <div class="td-tabs" id="tdTabs">
    <button class="td-tab active" data-tab="practice_log">模組1 STAR提示語<span class="cnt" id="cntPractice"></span></button>
    <button class="td-tab" data-tab="share2">模組2 NotebookLM<span class="cnt" id="cntShare2"></span></button>
    <button class="td-tab" data-tab="share3">模組3 AI海報<span class="cnt" id="cntShare3"></span></button>
  </div>
  <div class="sort-row" id="dashSortRow">
    <button class="sortbtn active" data-sort="recent">🕐 最新繳交</button>
    <button class="sortbtn" data-sort="worst">🔻 待處理優先</button>
    <button class="sortbtn" data-sort="best">🔺 表現優先</button>
  </div>
  <div class="td-panel" id="panel-practice_log"><div id="colPractice"></div></div>
  <div class="td-panel" id="panel-share2" hidden><div id="colShare2"></div></div>
  <div class="td-panel" id="panel-share3" hidden><div id="colShare3"></div></div>
  <div class="td-note">
    點每一則可展開看完整掃描細節（連結／評分項目／建議）。🔍待複查＝格式已確認正確，但內容是系統技術上讀不到的類型（ChatGPT/Gemini/NotebookLM分享頁），需要妳親自開連結看。⚠️讀取失敗＝連結本身可能有問題（打不開／不是網址）。<br>
    此頁只顯示掃描結果，不會自動觸發掃描。掃描由本機背景watcher完成後寫回Firebase，這頁即時反映最新結果。
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBwPR0oE5VK0eBlqq8JY1B56UXy3R9cyng",
  databaseURL: "https://gen-lang-client-0929530380-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gen-lang-client-0929530380",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOT = "nacs0914";
const TEACHER_CODE = "0914"; // 老師專用密碼(正日期)，跟學員的4190(反過來)不同，不要告訴學員

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starsHtml(n){ n = Math.max(0, Math.min(5, Number(n)||0)); return '⭐'.repeat(n) + '☆'.repeat(5-n); }

function fetchBadge(fetchStatus) {
  if (!fetchStatus || fetchStatus === 'ok') return '';
  if (fetchStatus === 'unreadable_js_app' || fetchStatus === 'requires_google_login') return '<span class="badge-review">🔍待複查</span>';
  return '<span class="badge-bad">⚠️讀取失敗</span>';
}

let dashSortMode = 'recent';
const lastData = {};

// overall越差分數越小；同一overall再依stars排序
const OVERALL_RANK = { '完成': 3, '需加強': 2, '疑似無效或空白': 1, '掃描失敗': 0 };
function qualityScore(s) {
  if (!s) return -1; // 尚未掃描排最前面(待處理優先)或最後面(表現優先)由排序方向決定
  const rank = OVERALL_RANK[s.overall] ?? 1;
  return rank * 10 + (Number(s.stars) || 0);
}

function sortIds(ids, raw, scr) {
  if (dashSortMode === 'worst') return ids.sort((a,b) => qualityScore(scr[a]) - qualityScore(scr[b]));
  if (dashSortMode === 'best') return ids.sort((a,b) => qualityScore(scr[b]) - qualityScore(scr[a]));
  return ids.sort((a,b) => (raw[b].updatedAt||0) - (raw[a].updatedAt||0));
}

function renderList(collection, elId, cntId) {
  const data = lastData[collection];
  if (!data) return;
  const { raw, scr } = data;
  const el = document.getElementById(elId);
  const cntEl = document.getElementById(cntId);
  const ids = sortIds(Object.keys(raw), raw, scr);
  const studentCount = new Set(ids.map(id => id.slice(0, id.lastIndexOf('_')))).size;
  if (cntEl) cntEl.textContent = `${studentCount}人／${ids.length}件`;
  if (!ids.length) { el.innerHTML = '<div class="td-empty">目前還沒有人繳交</div>'; return; }
  el.innerHTML = ids.map((id, i) => {
    const d = raw[id], s = scr[id];
    const overallClass = s ? (s.overall === '完成' ? 'ok' : 'warn') : '';
    return `<details class="td-item">
      <summary>
        <span class="nm">${escapeHtml(d.nickname||'匿名')}</span>
        ${s ? `<span class="overall ${overallClass}">${escapeHtml(s.overall||'')}</span>` : '<span class="overall warn">尚未掃描</span>'}
        ${s ? `<span class="stars">${starsHtml(s.stars)}</span>` : ''}
        ${s ? fetchBadge(s.fetchStatus) : ''}
      </summary>
      <div class="td-body">
        <a href="${escapeHtml(d.content||'')}" target="_blank">${escapeHtml(d.content||'')}</a>
        ${s && s.criteria ? `<div class="crit">${s.criteria.map(c => `<div class="${c.pass?'':'no'}">${c.pass?'✓':'✗'} ${escapeHtml(c.name)}：${escapeHtml(c.note||'')}</div>`).join('')}</div>` : ''}
        ${s && s.suggestion ? `<div class="sugg">💡 ${escapeHtml(s.suggestion)}</div>` : ''}
      </div>
    </details>`;
  }).join('');
}

function renderColumn(collection, elId, cntId) {
  db.ref(`${ROOT}/${collection}`).on('value', rawSnap => {
    db.ref(`${ROOT}/screening/${collection}`).on('value', scrSnap => {
      lastData[collection] = { raw: rawSnap.val() || {}, scr: scrSnap.val() || {} };
      renderList(collection, elId, cntId);
    });
  });
}

function initDashSort() {
  const row = document.getElementById('dashSortRow');
  if (!row) return;
  row.querySelectorAll('.sortbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      dashSortMode = btn.dataset.sort;
      row.querySelectorAll('.sortbtn').forEach(b => b.classList.toggle('active', b === btn));
      renderList('practice_log', 'colPractice', 'cntPractice');
      renderList('share2', 'colShare2', 'cntShare2');
      renderList('share3', 'colShare3', 'cntShare3');
    });
  });
}

function initTabs() {
  const tabs = document.querySelectorAll('.td-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.td-panel').forEach(p => { p.hidden = (p.id !== `panel-${tab.dataset.tab}`); });
    });
  });
}

function initGate() {
  const gate = document.getElementById('gate'), content = document.getElementById('pageContent');
  if (localStorage.getItem('nacs0914_teacher_ok') === '1') { gate.hidden = true; content.hidden = false; return; }
  gate.hidden = false; content.hidden = true;
  const input = document.getElementById('gatePass'), btn = document.getElementById('gateBtn'), status = document.getElementById('gateStatus');
  const tryEnter = () => {
    if ((input.value||'').trim() !== TEACHER_CODE) { status.textContent = '密碼不對'; return; }
    try { localStorage.setItem('nacs0914_teacher_ok', '1'); } catch(e) {}
    gate.hidden = true; content.hidden = false;
  };
  btn.addEventListener('click', tryEnter);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
}

document.addEventListener('DOMContentLoaded', () => {
  initGate();
  initTabs();
  initDashSort();
  renderColumn('practice_log', 'colPractice', 'cntPractice');
  renderColumn('share2', 'colShare2', 'cntShare2');
  renderColumn('share3', 'colShare3', 'cntShare3');
});
</script>
</body>
</html>
